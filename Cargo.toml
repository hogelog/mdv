[package]
name = "mdv"
version = "0.1.0"
edition = "2021"
description = "A local Markdown viewer"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
html-escape = "0.2"
libc = "0.2"
open = "5"
percent-encoding = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
usage = { package = "usage-rs", version = "6" }

[dev-dependencies]
tempfile = "3"
